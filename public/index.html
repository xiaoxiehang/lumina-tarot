<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumina Tarot — AI Tarot Reading & Daily Horoscope</title>
<meta name="description" content="Free AI tarot readings and daily horoscopes. Draw cards, ask questions, get mystical guidance.">
<style>
:root {
--bg: #0d0b1e; --bg2: #16132e; --card: #1e1a3d; --gold: #d4af6a; --gold2: #f0d49a;
--ink: #ece8f5; --muted: #8f8aa8; --accent: #7b6ff0; --line: #2c2752;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent;}
body { background: radial-gradient(1200px 800px at 50% -10%, #1c1740 0%, var(--bg) 55%) fixed, var(--bg);
color: var(--ink); font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
min-height: 100vh;}
.wrap { max-width: 480px; margin: 0 auto; padding: 0 20px 60px;}
header { text-align: center; padding: 36px 0 8px;}
header.stars { font-size: 13px; letter-spacing: 6px; color: var(--gold); opacity:.8;}
h1 { font-size: 30px; font-weight: 700; letter-spacing: 2px; margin: 8px 0 4px;
background: linear-gradient(120deg, var(--gold2), var(--gold)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;}
.sub { color: var(--muted); font-size: 14px;}
nav { display: flex; gap: 8px; margin: 22px 0;}
nav button { flex: 1; padding: 11px 4px; border: 1px solid var(--line); background: var(--bg2); color: var(--muted);
border-radius: 12px; font-size: 14px; cursor: pointer; transition:.2s;}
nav button.on { background: linear-gradient(135deg, #2a2358, #1e1a3d); color: var(--gold2); border-color: var(--gold);}
section { display: none;} section.on { display: block; animation: fade.3s;}
@keyframes fade { from { opacity: 0; transform: translateY(8px);}}
.spread-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 20px;}
.spread { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 12px;
cursor: pointer; transition:.2s; text-align: center;}
.spread:hover { border-color: var(--gold); transform: translateY(-2px);}
.spread.t { font-size: 15px; font-weight: 600; margin-bottom: 4px;}
.spread.e { font-size: 11px; color: var(--muted);}
.spread.d { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.5;}
.qbox { margin: 6px 0 16px;}
.qbox input { width: 100%; padding: 13px 15px; border-radius: 12px; border: 1px solid var(--line);
background: var(--bg2); color: var(--ink); font-size: 15px; outline: none;}
.qbox input:focus { border-color: var(--gold);}
.qbox input::placeholder { color: #5c5778;}
.btn { display: block; width: 100%; padding: 15px; border: none; border-radius: 14px; font-size: 16px; font-weight: 700;
cursor: pointer; background: linear-gradient(135deg, var(--gold), #b8934e); color: #1a1408; letter-spacing: 1px;}
.btn:disabled { opacity:.5; cursor: wait;}
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); margin-top: 10px; font-weight: 400;}
.cards { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 18px 0;}
.tcard { width: 96px; height: 150px; border-radius: 10px; perspective: 600px; cursor: pointer;}
.tcard.inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform.6s;}
.tcard.flip.inner { transform: rotateY(180deg);}
.tcard.face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 10px;
display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; text-align: center;}
.tcard.back { background: linear-gradient(150deg, #241f4e, #141130); border: 1px solid var(--gold); font-size: 26px;}
.tcard.front { background: linear-gradient(160deg, #f5eeda, #e8dcc0); color: #2a2118; transform: rotateY(180deg);
border: 1px solid var(--gold);}
.tcard.front.rev.art { transform: rotate(180deg);}
.tcard.num { font-size: 10px; color: #8a6d3b; letter-spacing: 1px;}
.tcard.art { font-size: 30px; margin: 6px 0;}
.tcard.nm { font-size: 11px; font-weight: 700; line-height: 1.3;}
.tcard.pos { font-size: 10px; color: var(--muted); margin-top: 10px;}
.cardrow { display: flex; flex-direction: column; align-items: center;}
.result { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-top: 16px; line-height: 1.85; font-size: 14.5px; white-space: pre-wrap;}
.result h3 { color: var(--gold2); font-size: 15px; margin-bottom: 10px;}
.loading { text-align: center; color: var(--muted); padding: 24px; font-size: 14px;}
.loading.spin { font-size: 28px; display: block; margin-bottom: 10px; animation: spin 2s linear infinite;}
@keyframes spin { to { transform: rotate(360deg);}}
.zgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0;}
.zcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 6px;
text-align: center; cursor: pointer; transition:.2s;}
.zcard:hover { border-color: var(--gold);}
.zcard.ic { font-size: 26px;}.zcard.n { font-size: 13px; margin-top: 6px;}.zcard.d { font-size: 10px; color: var(--muted);}
.hist { margin-top: 8px;}
.hitem { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; margin-bottom: 10px; cursor: pointer;}
.hitem.t { font-size: 14px; font-weight: 600;}.hitem.s { font-size: 12px; color: var(--muted); margin-top: 4px;}
footer { text-align: center; color: #4a4568; font-size: 12px; margin-top: 40px; line-height: 1.8;}
.carddetail { background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 8px 0; font-size: 13px; line-height: 1.7;}
.carddetail b { color: var(--gold2);}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="stars">✦ ✦ ✦</div>
<h1>LUMINA TAROT</h1>
<div class="sub">AI-powered tarot readings & daily horoscopes</div>
</header>
<nav>
<button class="on" data-tab="tarot">🔮 Tarot</button>
<button data-tab="stars">⭐ Horoscope</button>
<button data-tab="hist">📜 History</button>
</nav>

<section id="tab-tarot" class="on">
<div class="spread-grid" id="spreads"></div>
<div class="qbox"><input id="question" placeholder="Ask a question (optional) — e.g. Should I take the new job?"></div>
<button class="btn" id="drawBtn" onclick="draw()">✦ Draw Cards ✦</button>
<div class="cards" id="cards"></div>
<div id="out"></div>
</section>

<section id="tab-stars">
<p class="sub" style="text-align:center;margin-bottom:6px">Tap your sign for today's horoscope</p>
<div class="zgrid" id="zgrid"></div>
<div id="hout"></div>
</section>

<section id="tab-hist">
<div class="hist" id="hist"></div>
</section>

<footer>For reflection & entertainment.<br>Lumina Tarot · 2026</footer>
</div>

<script src="tarot-data.js"></script>
<script>
const $ = id => document.getElementById(id);
let curSpread = "three", drawn = [];

// tabs
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
document.querySelectorAll("nav button").forEach(x => x.classList.remove("on"));
document.querySelectorAll("section").forEach(x => x.classList.remove("on"));
b.classList.add("on"); $("tab-" + b.dataset.tab).classList.add("on");
if (b.dataset.tab === "hist") renderHist();
});

// spreads
$("spreads").innerHTML = Object.entries(SPREADS).map(([k, s]) =>
`<div class="spread" data-k="${k}" onclick="pickSpread('${k}')">
<div class="t">${s.name}</div><div class="e">${s.name_en} · ${s.count} cards</div><div class="d">${s.desc}</div>
</div>`).join("");
function pickSpread(k) {
curSpread = k;
document.querySelectorAll(".spread").forEach(x => x.style.borderColor = x.dataset.k === k? "#d4af6a": "");
$("cards").innerHTML = ""; $("out").innerHTML = "";
}
pickSpread("three");

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]];} return a;}

function draw() {
const s = SPREADS[curSpread];
const deck = shuffle([...MAJOR_ARCANA]);
drawn = deck.slice(0, s.count).map((c, i) => ({
...c, reversed: Math.random() < 0.35,
position: s.positions? s.positions[i]: `Card ${i + 1}`
}));
$("out").innerHTML = "";
$("cards").innerHTML = drawn.map((c, i) => `
<div class="cardrow">
<div class="tcard" id="tc${i}" onclick="flip(${i})"><div class="inner">
<div class="face back">✦</div>
<div class="face front ${c.reversed? "rev": ""}">
<div class="art">${c.reversed? "⟲": "✧"}</div>
<div class="num">${c.n === 0? "0": c.n}</div>
<div class="nm">${c.en}</div>
</div>
</div></div>
<div class="pos">${c.position}</div>
</div>`).join("");
// auto flip staggered
drawn.forEach((_, i) => setTimeout(() => flip(i), 350 + i * 280));
setTimeout(showDetails, 350 + drawn.length * 280 + 400);
}
function flip(i) { const el = $("tc" + i); if (el &&!el.classList.contains("flip")) el.classList.add("flip");}

function showDetails() {
const q = $("question").value.trim();
let h = `<div class="carddetail"><b>Your cards:</b><br>` + drawn.map(c =>
`<b>${c.en} (${c.zh})</b> ${c.reversed? "⟲ Reversed": "✧ Upright"} — ${c.reversed? c.rev: c.up}`
).join("<br>") + `</div>
<button class="btn" id="aiBtn" onclick="interpret()">✦ Reveal AI Interpretation ✦</button>
<button class="btn ghost" onclick="draw()">↻ Draw Again</button>`;
$("out").innerHTML = h;
}

async function interpret() {
const btn = $("aiBtn"); btn.disabled = true;
$("out").insertAdjacentHTML("beforeend", `<div class="loading" id="ld"><span class="spin">🔮</span>The stars are aligning…</div>`);
const q = $("question").value.trim();
try {
const r = await fetch("/api/interpret", { method: "POST", headers: { "Content-Type": "application/json"},
body: JSON.stringify({ type: "tarot", cards: drawn, question: q})});
const d = await r.json();
$("ld").remove();
if (d.text) {
$("out").insertAdjacentHTML("beforeend", `<div class="result"><h3>✦ AI Interpretation</h3>${esc(d.text)}</div>`);
saveHist({ kind: "tarot", title: SPREADS[curSpread].name + (q? " — " + q: ""), text: d.text, at: Date.now()});
} else $("out").insertAdjacentHTML("beforeend", `<div class="result">The stars are silent right now. Try again in a moment.</div>`);
} catch (e) {
const l = $("ld"); if (l) l.remove();
$("out").insertAdjacentHTML("beforeend", `<div class="result">Connection hiccup — please try again.</div>`);
}
btn.disabled = false;
}

// horoscope
$("zgrid").innerHTML = ZODIAC.map((z, i) =>
`<div class="zcard" onclick="horo(${i})"><div class="ic">${z.icon}</div><div class="n">${z.en}</div><div class="d">${z.dates}</div></div>`).join("");

async function horo(i) {
const z = ZODIAC[i];
$("hout").innerHTML = `<div class="loading"><span class="spin">⭐</span>Reading the stars for ${z.en}…</div>`;
try {
const r = await fetch("/api/interpret", { method: "POST", headers: { "Content-Type": "application/json"},
body: JSON.stringify({ type: "horoscope", sign: z.en + " (" + z.zh + ")"})});
const d = await r.json();
if (d.text) {
$("hout").innerHTML = `<div class="result"><h3>${z.icon} ${z.en} — Today</h3>${esc(d.text)}</div>`;
saveHist({ kind: "horoscope", title: z.en + " daily horoscope", text: d.text, at: Date.now()});
} else $("hout").innerHTML = `<div class="result">The stars are silent right now.</div>`;
} catch (e) { $("hout").innerHTML = `<div class="result">Connection hiccup — please try again.</div>`;}
}

// history
function saveHist(h) {
try { const a = JSON.parse(localStorage.getItem("lumina_hist") || "[]"); a.unshift(h);
localStorage.setItem("lumina_hist", JSON.stringify(a.slice(0, 30)));} catch (e) {}
}
function renderHist() {
let a = []; try { a = JSON.parse(localStorage.getItem("lumina_hist") || "[]");} catch (e) {}
$("hist").innerHTML = a.length? a.map((h, i) => `
<div class="hitem" onclick="viewHist(${i})"><div class="t">${esc(h.title)}</div>
<div class="s">${new Date(h.at).toLocaleString()} · ${h.kind}</div></div>`).join("")
: `<p class="sub" style="text-align:center;padding:30px">No readings yet.<br>Draw your first cards under the Tarot tab.</p>`;
window._hist = a;
}
function viewHist(i) {
const h = window._hist[i];
$("hist").innerHTML = `<div class="result"><h3>${esc(h.title)}</h3>${esc(h.text)}</div>
<button class="btn ghost" onclick="renderHist()">← Back</button>`;
}
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");}
</script>
</body>
</html>
